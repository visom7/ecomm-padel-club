spring.application.name=ecomm-padel-club
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/padel}
server.port=${PORT:8080}

# Admin PIN (sobreescribir en producción vía variable de entorno)
app.admin-pin=${ADMIN_PIN:changeme}

# CORS
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173}

# Logging
logging.level.root=INFO
logging.level.com.ecommpadel=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
